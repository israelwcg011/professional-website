<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  --text: #1c1814; --text-muted: #7a6f65; --text-faint: #b0a89e;

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

// ── THEMES ────────────────────────────────────────────────────────────────
const THEMES = {
  warm: { name: "Warm Editorial",
    '--bg':'#f5f0e8','--bg-card':'#ede7db','--bg-surface':'#e0d9cc',
    '--text':'#1c1814','--text-muted':'#7a6f65','--text-faint':'#b0a89e',
    '--accent':'oklch(38% 0.18 265)','--accent-bg':'oklch(38% 0.18 265 / 0.10)',
    '--accent-hover':'oklch(32% 0.18 265)','--border':'#d0c8bc',
    '--hfont':"'Playfair Display', serif",'--bfont':"'DM Sans', sans-serif" },
  dark: { name: "Dark Scholar",
    '--bg':'#0f0e0d','--bg-card':'#181614','--bg-surface':'#211f1c',
    '--text':'#f0ebe0','--text-muted':'#8a8278','--text-faint':'#4a4640',
    '--accent':'oklch(70% 0.16 265)','--accent-bg':'oklch(70% 0.16 265 / 0.12)',
    '--accent-hover':'oklch(76% 0.16 265)','--border':'#2e2b27',
    '--hfont':"'Playfair Display', serif",'--bfont':"'DM Sans', sans-serif" },
  tech: { name: "Clean Technical",
    '--bg':'#f9f9fc','--bg-card':'#ffffff','--bg-surface':'#f0f0f6',
    '--text':'#1a1a2e','--text-muted':'#6b6b80','--text-faint':'#c0c0cc',
    '--accent':'oklch(42% 0.22 265)','--accent-bg':'oklch(42% 0.22 265 / 0.09)',
    '--accent-hover':'oklch(36% 0.22 265)','--border':'#e0e0eb',
    '--hfont':"'DM Sans', sans-serif",'--bfont':"'DM Sans', sans-serif" },
};

function applyTheme(key) {
  const t = THEMES[key];
  Object.entries(t).forEach(([k,v]) => { if(k.startsWith('--')) document.documentElement.style.setProperty(k, v); });
}

// ── TWEAKS ────────────────────────────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "fontSize": 17
}/*EDITMODE-END*/;

function useTweaks() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('io_tweaks') || '{}'); } catch { return {}; } })();
  const [tweaks, setTweaksState] = useState({ ...TWEAK_DEFAULTS, ...saved });
  const setTweaks = (patch) => {
    setTweaksState(prev => {
      const next = { ...prev, ...patch };
      localStorage.setItem('io_tweaks', JSON.stringify(next));
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
      return next;
    });
  };
  return [tweaks, setTweaks];
}

// ── NAV ───────────────────────────────────────────────────────────────────
function Nav({ page, setPage }) {
  const links = [['about','About'],['resume','Resume'],['portfolio','Portfolio'],['blog','Blog'],['talks','Talks'],['chat','Chat']];
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const h = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', h);
    return () => window.removeEventListener('scroll', h);
  }, []);
  const s = {
    nav: { position:'fixed', top:0, left:0, right:0, zIndex:100,
      background: scrolled ? 'var(--bg)' : 'transparent',
      borderBottom: scrolled ? '1px solid var(--border)' : '1px solid transparent',
      transition: 'all 300ms ease', backdropFilter: scrolled ? 'blur(12px)' : 'none' },
    inner: { display:'flex', alignItems:'center', justifyContent:'space-between', height:60 },
    logo: { fontFamily:'var(--hfont)', fontWeight:700, fontSize:17, letterSpacing:'-0.01em', cursor:'pointer', color:'var(--text)' },
    links: { display:'flex', gap:32, alignItems:'center' },
    link: (active) => ({ fontSize:13, fontWeight: active ? 600 : 400, color: active ? 'var(--accent)' : 'var(--text-muted)',
      cursor:'pointer', letterSpacing:'0.02em', transition:'color var(--transition)',
      textDecoration: active ? 'none' : 'none', padding:'4px 0',
      borderBottom: active ? '1px solid var(--accent)' : '1px solid transparent' }),
    cta: { fontSize:12, fontWeight:600, padding:'7px 18px', border:'1px solid var(--accent)', borderRadius:'var(--radius)',
      color:'var(--accent)', cursor:'pointer', letterSpacing:'0.04em', textTransform:'uppercase', transition:'all var(--transition)' }
  };
  return (
    <nav style={s.nav}>
      <div className="container"><div style={s.inner}>
        <span style={s.logo} onClick={() => setPage('home')}>Israel Oliveira</span>
        <div style={s.links}>
          {links.map(([id,label]) => (
            <span key={id} style={s.link(page===id)} onClick={() => setPage(id)}>{label}</span>
          ))}
          <span style={s.cta} onClick={() => setPage('contact')}
            onMouseEnter={e => { e.target.style.background='var(--accent)'; e.target.style.color='var(--bg)'; }}
            onMouseLeave={e => { e.target.style.background='transparent'; e.target.style.color='var(--accent)'; }}>
            Contact
          </span>
        </div>
      </div></div>
    </nav>
  );
}

// ── IRIS CHAT ─────────────────────────────────────────────────────────────
function ChatPage() {
  const [messages, setMessages] = useState([
    { role:'assistant', content:"Hi, I'm **IRIS** — Israel's Research & Information System. I know everything about Israel's projects, blog, experience, and talks. Ask me anything." }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [messages]);

  const send = async () => {
    const text = input.trim();
    if (!text || loading) return;
    setInput('');
    const userMsg = { role:'user', content: text };
    setMessages(prev => [...prev, userMsg]);
    setLoading(true);
    try {
      const history = messages.filter(m => m.role !== 'system').map(m => ({ role: m.role, content: m.content }));
      const result = await window.claude.complete({
        messages: [
          { role:'user', content: SITE_DATA.irisContext + '\n\nNow answer the following user question:\n\n' + text }
        ]
      });
      setMessages(prev => [...prev, { role:'assistant', content: result }]);
    } catch(e) {
      setMessages(prev => [...prev, { role:'assistant', content:'Sorry, I ran into an error. Please try again.' }]);
    }
    setLoading(false);
  };

  const suggestions = ["What projects has Israel worked on?", "Tell me about NeuralSearch", "What talks has Israel given?", "What's his tech stack?"];

  const renderContent = (text) => {
    return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
  };

  const s = {
    wrap: { paddingTop:100, paddingBottom:0, height:'100vh', display:'flex', flexDirection:'column' },
    header: { paddingTop:20, paddingBottom:20, borderBottom:'1px solid var(--border)' },
    name: { fontFamily:'var(--hfont)', fontSize:28, fontWeight:700, letterSpacing:'-0.01em', marginBottom:4 },
    desc: { fontSize:14, color:'var(--text-muted)' },
    chatArea: { flex:1, overflowY:'auto', padding:'32px 0' },
    bubble: (role) => ({
      maxWidth:640, marginBottom:24, padding:'16px 20px', borderRadius:4,
      background: role==='user' ? 'var(--accent)' : 'var(--bg-card)',
      color: role==='user' ? 'var(--bg)' : 'var(--text)',
      marginLeft: role==='user' ? 'auto' : 0,
      fontSize:15, lineHeight:1.7,
      border: role==='assistant' ? '1px solid var(--border)' : 'none'
    }),
    roleLabel: (role) => ({ fontSize:11, letterSpacing:'0.08em', textTransform:'uppercase', fontWeight:600, marginBottom:8, color: role==='user' ? 'oklch(80% 0.08 265)' : 'var(--text-faint)' }),
    inputArea: { borderTop:'1px solid var(--border)', padding:'20px 0', background:'var(--bg)' },
    inputRow: { display:'flex', gap:12 },
    input: { flex:1, background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:'var(--radius)', padding:'14px 18px', fontSize:15, color:'var(--text)', outline:'none', transition:'border-color var(--transition)' },
    sendBtn: { padding:'14px 24px', background:'var(--accent)', color:'var(--bg)', border:'none', borderRadius:'var(--radius)', fontSize:14, fontWeight:600, cursor:'pointer', opacity: loading ? 0.5 : 1 },
    suggestions: { display:'flex', gap:8, flexWrap:'wrap', marginBottom:20 },
    suggBtn: { fontSize:12, padding:'7px 14px', background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:20, color:'var(--text-muted)', cursor:'pointer', transition:'all var(--transition)' },
    dots: { display:'inline-flex', gap:4, padding:'12px 16px', background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:4 }
  };

  return (
    <div style={s.wrap}>
      <div className="container" style={{ display:'flex', flexDirection:'column', flex:1 }}>
        <div style={s.header}>
          <p style={s.name}>IRIS</p>
          <p style={s.desc}>Israel's Research & Information System · Ask me anything</p>
        </div>
        <div style={s.chatArea}>
          {messages.map((m, i) => (
            <div key={i} style={{ marginBottom:8 }}>
              <p style={s.roleLabel(m.role)}>{m.role === 'user' ? 'You' : 'IRIS'}</p>
              <div style={s.bubble(m.role)} dangerouslySetInnerHTML={{ __html: renderContent(m.content) }}/>
            </div>
          ))}
          {loading && (
            <div>
              <p style={s.roleLabel('assistant')}>IRIS</p>
              <div style={s.dots}>
                {[0,1,2].map(i => <span key={i} style={{ width:6, height:6, borderRadius:'50%', background:'var(--text-faint)', display:'inline-block', animation:`dot ${0.8}s ${i*0.2}s infinite alternate` }}/>)}
              </div>
            </div>
          )}
          <div ref={endRef}/>
        </div>
        <div style={s.inputArea}>
          {messages.length <= 1 && (
            <div style={s.suggestions}>
              {suggestions.map(s => <button key={s} style={{ fontSize:12, padding:'7px 14px', background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:20, color:'var(--text-muted)', cursor:'pointer' }} onClick={() => { setInput(s); }}>{s}</button>)}
            </div>
          )}
          <div style={s.inputRow}>
            <input style={s.input} value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key==='Enter' && send()}
              onFocus={e => e.target.style.borderColor='var(--accent)'}
              onBlur={e => e.target.style.borderColor='var(--border)'}
              placeholder="Ask about projects, experience, talks..." />
            <button style={s.sendBtn} onClick={send} disabled={loading}>Send</button>
          </div>
        </div>
      </div>
      <style>{`@keyframes dot { from { opacity:0.3; transform:translateY(0) } to { opacity:1; transform:translateY(-4px) } }`}</style>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App() {
  const saved = (() => { try { return localStorage.getItem('io_page') || 'home'; } catch { return 'home'; } })();
  const [page, setPageState] = useState(saved);
  const [blogDetail, setBlogDetail] = useState(null);
  const [projectDetail, setProjectDetail] = useState(null);
  const [showTweaks, setShowTweaks] = useState(false);
  const [tweaks, setTweaksBase] = useTweaks();

  const setTweaks = (patch) => {
    setTweaksBase(patch);
    if (patch.theme) applyTheme(patch.theme);
    if (patch.fontSize) document.documentElement.style.fontSize = patch.fontSize + 'px';
  };

  const setPage = (p) => {
    setPageState(p);
    localStorage.setItem('io_page', p);
    window.scrollTo(0, 0);
    setBlogDetail(null);
    setProjectDetail(null);
  };

  useEffect(() => {
    applyTheme(tweaks.theme);
    document.documentElement.style.fontSize = tweaks.fontSize + 'px';
  }, []);

  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const renderPage = () => {
    if (blogDetail) return <BlogDetail id={blogDetail} setPage={(p) => { if(p==='blog') setBlogDetail(null); else setPage(p); }}/>;
    if (projectDetail) return <ProjectDetail id={projectDetail} setPage={(p) => { if(p==='portfolio') setProjectDetail(null); else setPage(p); }}/>;
    switch(page) {
      case 'home': return <HomePage setPage={setPage}/>;
      case 'about': return <AboutPage setPage={setPage}/>;
      case 'resume': return <ResumePage/>;
      case 'portfolio': return <PortfolioPage setDetail={setProjectDetail}/>;
      case 'blog': return <BlogPage setDetail={setBlogDetail}/>;
      case 'talks': return <TalksPage/>;
      case 'chat': return <ChatPage/>;
      case 'contact': return <ContactPage/>;
      default: return <HomePage setPage={setPage}/>;
    }
  };

  const isChatPage = (page === 'chat' && !blogDetail && !projectDetail);

  return (
    <>
      <Nav page={page} setPage={setPage}/>
      <main style={{ flex:1 }}>
        {renderPage()}
      </main>
      {!isChatPage && <Footer setPage={setPage}/>}
      {showTweaks && <TweaksPanel tweaks={tweaks} setTweaks={setTweaks}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
